name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - id: release
        uses: xescure/ci/.github/actions/release-images@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          test-job: ""
      - uses: xescure/ci/.github/actions/tag-images@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          images: ${{ steps.release.outputs.images }}
          tags: ${{ github.ref_name }} latest
      # The release's compose.yaml names its own version, so that a node runs
      # the release its file came from until a newer file is downloaded,
      # however often it pulls.
      - name: Publish compose.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed -i "s|ghcr.io/xescure/slop-node:latest|ghcr.io/xescure/slop-node:${TAG}|" compose.yaml
          grep -q "ghcr.io/xescure/slop-node:${TAG}" compose.yaml
          gh release create "$TAG" compose.yaml --verify-tag --generate-notes
      - uses: xescure/ci/.github/actions/prod-branch@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          commit: ${{ steps.release.outputs.commit }}
