name: release

on:
  push:
    tags: ["v*"]

jobs:
  # A v* tag names the image main built for that commit, by the digest main's
  # own run recorded, v<version> and latest; it never builds. slop-node has no
  # deploy to test, so main's run need only have succeeded.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - id: release
        uses: xescure/ci/.github/actions/release-images@60231c4ea0c261b13f2cc52472f764d982165c1d # main
        with:
          test-job: ""
      - uses: xescure/ci/.github/actions/tag-images@60231c4ea0c261b13f2cc52472f764d982165c1d # main
        with:
          images: ${{ steps.release.outputs.images }}
          tags: ${{ github.ref_name }} latest
