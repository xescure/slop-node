name: release

on:
  push:
    tags: ["v*"]

jobs:
  # A v* tag names the image main built for that commit, by the digest main's
  # own run recorded, v<version> and latest; it never builds. slop-node has no
  # deploy to test, so main's run need only have succeeded.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - id: release
        uses: xescure/ci/.github/actions/release-images@24e1cd8300d1388705f3a5dcef0172f9d8c938a3 # main
        with:
          test-job: ""
      - uses: xescure/ci/.github/actions/tag-images@24e1cd8300d1388705f3a5dcef0172f9d8c938a3 # main
        with:
          images: ${{ steps.release.outputs.images }}
          tags: ${{ github.ref_name }} latest
