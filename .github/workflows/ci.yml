name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks run the package and the image as built, so they add little
  # beyond the build. nix-image.yml does not push yet: until it does, main
  # pushes no image.
  build:
    uses: xescure/ci/.github/workflows/nix-image.yml@d4f685a9bc8da3c4447b348713b76c37baf2919e
    with:
      checks: help run-memory run-postgres closure image nixpkgs-pin
      images: image
      lockfiles: package-lock.json
      # The image check runs the entrypoint under bwrap.
      bwrap: true
