name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/xescure/slop-node

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Single-user Nix: the runner owns /nix/store, so cache-nix-action can
      # restore into it (a root-owned multi-user store fails every file).
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-image-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'package-lock.json') }}
          restore-prefixes-first-match: nix-image-v1-${{ runner.os }}-
      - run: nix build .#image -L
      # The checks run the package and the image as built above, so they add
      # little beyond the build.
      - run: nix flake check -L
      # The tag a deployment follows is moved only once the image is in the
      # registry under its commit, and to that very manifest.
      - name: Push
        if: github.event_name == 'push'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }
          REGISTRY_AUTH_FILE=$(mktemp)
          export REGISTRY_AUTH_FILE
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          echo '{}' >"$REGISTRY_AUTH_FILE"
          skopeo login ghcr.io -u "$GHCR_USER" --password-stdin <<<"$GHCR_TOKEN" >/dev/null
          skopeo copy "docker-archive:$(readlink -f result)" "docker://$IMAGE:sha-$GITHUB_SHA"
          skopeo copy "docker://$IMAGE:sha-$GITHUB_SHA" "docker://$IMAGE:latest"
          echo "pushed $IMAGE@$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest") as sha-$GITHUB_SHA and latest"
      # Railway's own watch of a tag may take hours to notice a new digest, so
      # the service is redeployed from :latest once it moved. Until the project
      # token and the service's IDs are set, the image only waits in the registry.
      - name: Redeploy on Railway
        if: github.event_name == 'push'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ] || [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "::notice::no RAILWAY_TOKEN secret or RAILWAY_SERVICE_ID / RAILWAY_ENVIRONMENT_ID variable; not redeploying"
            exit 0
          fi
          header=$(mktemp)
          trap 'rm -f "$header"' EXIT
          echo "Project-Access-Token: $RAILWAY_TOKEN" >"$header"
          jq -n --arg s "$RAILWAY_SERVICE_ID" --arg e "$RAILWAY_ENVIRONMENT_ID" \
            '{query: "mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }", variables: {s: $s, e: $e}}' |
            curl -fsS https://backboard.railway.com/graphql/v2 -H 'Content-Type: application/json' -H @"$header" --data-binary @- >response.json
          if ! jq -e '.data.serviceInstanceDeployV2 // empty' response.json >/dev/null; then
            echo "::error::Railway did not deploy: $(jq -c '.errors // .' response.json)"
            exit 1
          fi
          echo "Railway deployment $(jq -r '.data.serviceInstanceDeployV2' response.json)"
