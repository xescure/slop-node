name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  # Weekly, so main's Nix cache (evicted after 7 days unused) stays warm.
  schedule:
    - cron: "41 4 * * 1"

# A pull request's runs share a group by number: a merged pull request's
# "closed" run gets the base branch as its ref, and must not cancel main's push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks and the image in one job on one restored Nix store; pushes the
  # image (sha-<commit> and main from main, pr-<n> from a pull request). A v*
  # tag moves latest to what main built (release.yml).
  build:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: xescure/ci/.github/workflows/nix-image.yml@1796708e067d89e95ccbdaa2a4112b94c9f08a02 # main
    with:
      checks: help run-memory run-postgres closure image
      images: image
      lockfiles: package-lock.json
      # The image check runs the entrypoint under bwrap, which needs an
      # unprivileged user namespace; Ubuntu's AppArmor policy denies its uid map.
      bwrap: true

  pr-images:
    if: github.event.action == 'closed'
    permissions:
      contents: read
      packages: write
    uses: xescure/ci/.github/workflows/pr-images.yml@1796708e067d89e95ccbdaa2a4112b94c9f08a02 # main
    with:
      images: image
