name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  # Weekly, so main's Nix cache (evicted after 7 days unused) stays warm.
  schedule:
    - cron: "41 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks and the image in one job on one restored Nix store; pushes the
  # image (sha-<commit> and main from main, pr-<n> from a pull request). A v*
  # tag moves latest to what main built (release.yml).
  build:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: xescure/ci/.github/workflows/nix-image.yml@c5e7a560395fabd6c5eee2155354fed9bf6c2ad9 # nix-image branch, until xescure/ci merges it
    with:
      checks: help run-memory run-postgres closure image
      images: image
      lockfiles: package-lock.json
      # The image check runs the entrypoint under bwrap, which needs an
      # unprivileged user namespace; Ubuntu's AppArmor policy denies its uid map.
      bwrap: true

  pr-images:
    if: github.event.action == 'closed'
    permissions:
      contents: read
      packages: write
    uses: xescure/ci/.github/workflows/pr-images.yml@c5e7a560395fabd6c5eee2155354fed9bf6c2ad9 # nix-image branch, until xescure/ci merges it
    with:
      images: image
