# SPIKE, not for merge: does the image check's bwrap run when the build goes
# through install-nix-action's multi-user daemon, with and without lifting
# Ubuntu's AppArmor restriction on unprivileged user namespaces?
name: ci

on:
  pull_request:

jobs:
  image-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        userns-sysctl: [lifted, default]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.userns-sysctl == 'lifted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: cachix/install-nix-action@v31
      - name: Environment
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
          nix --version
          nix config show | grep -E '^(sandbox|sandbox-fallback|build-users-group|auto-allocate-uids) '
          ls -ld /nix/store; pgrep -a nix-daemon || true
      - run: nix build -L .#checks.x86_64-linux.image
      - run: nix flake check -L
